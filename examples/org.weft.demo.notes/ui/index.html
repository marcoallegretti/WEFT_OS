<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 24px;
    gap: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
  }
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    height: 32px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #e8e8e8;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s;
  }
  button:hover { background: #222; }
  button:active { background: #2a2a2a; }
  button.primary {
    background: #2a2a2a;
    border-color: #444;
  }
  button.primary:hover { background: #333; }
  textarea {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    padding: 20px;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: #444; }
  textarea::placeholder { color: #444; }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    height: 20px;
  }
  #status {
    font-size: 12px;
    color: #444;
  }
  #charcount {
    font-size: 12px;
    color: #444;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<header>
  <h1>Notes</h1>
  <div class="actions">
    <button id="discard">Discard</button>
    <button class="primary" id="save">Save</button>
  </div>
</header>
<textarea id="editor" placeholder="Start typing…" spellcheck="false"></textarea>
<footer>
  <span id="status">connecting…</span>
  <span id="charcount">0 chars</span>
</footer>

<script>
(function () {
  // The component stores the text exactly as typed. Messages are JSON; each
  // save names the revision it was edited from and is acknowledged by its
  // sequence number, so a reply never replaces text typed after it was sent.
  // The editor is read-only until it holds the stored text, so nothing typed
  // before a load completes can be saved over notes the user never saw.
  var MAX_MESSAGE = 65536; // weft-appd's limit for one app message, in bytes
  var REPLY_TIMEOUT = 10000;
  var editor = document.getElementById('editor');
  var statusEl = document.getElementById('status');
  var charEl = document.getElementById('charcount');
  var saveButton = document.getElementById('save');
  var saved = '';
  var rev = null;
  var seq = 0;
  var pending = null;
  var lastSent = null;
  var encoder = new TextEncoder();

  function setStatus(msg) { statusEl.textContent = msg; }
  function countChars() { charEl.textContent = editor.value.length + ' chars'; }
  function send(message) { window.weftIpc.send(JSON.stringify(message)); }
  function setLoaded(loaded) {
    editor.readOnly = !loaded;
    saveButton.disabled = !loaded || pending !== null;
  }

  editor.addEventListener('input', countChars);

  function finishSave() {
    if (pending) clearTimeout(pending.timer);
    pending = null;
    setLoaded(rev !== null);
  }

  saveButton.addEventListener('click', function () {
    if (!window.weftIpc || pending) return;
    if (rev === null) {
      setStatus('the notes have not loaded; use Discard to reload them');
      return;
    }
    var request = { op: 'save', seq: seq + 1, base: rev, text: editor.value };
    try {
      encodeURIComponent(request.text);
    } catch (_) {
      setStatus('not saved: the text contains characters that cannot be stored');
      return;
    }
    if (encoder.encode(JSON.stringify(request)).length > MAX_MESSAGE) {
      setStatus('not saved: the notes are too long');
      return;
    }
    seq += 1;
    lastSent = { seq: seq, text: request.text };
    pending = {
      seq: seq,
      text: request.text,
      timer: setTimeout(function () {
        finishSave();
        setStatus('not saved: no reply; try again');
      }, REPLY_TIMEOUT),
    };
    setLoaded(true);
    send(request);
    setStatus('saving…');
  });

  // Discard reloads the stored notes, replacing unsaved edits.
  document.getElementById('discard').addEventListener('click', function () {
    if (!window.weftIpc || pending || rev === null) return;
    editor.value = saved;
    countChars();
    rev = null;
    setLoaded(false);
    send({ op: 'load' });
    setStatus('reloading…');
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveButton.click();
    }
  });

  function onMessage(raw) {
    var msg;
    try { msg = JSON.parse(raw); } catch (_) { return; }
    if (msg.op === 'loaded') {
      // Only the reply to the outstanding load applies; the editor is
      // read-only until it arrives, so it never replaces newer text.
      if (rev !== null) return;
      editor.value = msg.text;
      countChars();
      saved = msg.text;
      rev = msg.rev;
      setLoaded(true);
      setStatus('');
    } else if (msg.op === 'saved' && lastSent && msg.seq === lastSent.seq) {
      // Also accepts an acknowledgement that arrives after the timeout.
      saved = lastSent.text;
      rev = msg.rev;
      finishSave();
      setStatus(editor.value === saved ? 'saved' : 'saved; newer changes are not saved yet');
    } else if (msg.op === 'error') {
      if (pending && msg.seq === pending.seq) finishSave();
      setStatus(msg.conflict
        ? 'not saved: changed in another window. Copy your text, then Discard to reload.'
        : 'error: ' + msg.message);
    }
  }

  function setupIpc() {
    if (!window.weftIpc) { setTimeout(setupIpc, 50); return; }
    window.weftIpc.onmessage = onMessage;
    send({ op: 'load' });
  }

  setLoaded(false);
  setupIpc();
})();
</script>
</body>
</html>
