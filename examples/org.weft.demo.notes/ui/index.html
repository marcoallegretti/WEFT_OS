<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 24px;
    gap: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
  }
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    height: 32px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #e8e8e8;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s;
  }
  button:hover { background: #222; }
  button:active { background: #2a2a2a; }
  button.primary {
    background: #2a2a2a;
    border-color: #444;
  }
  button.primary:hover { background: #333; }
  textarea {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    padding: 20px;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: #444; }
  textarea::placeholder { color: #444; }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    height: 20px;
  }
  #status {
    font-size: 12px;
    color: #444;
  }
  #charcount {
    font-size: 12px;
    color: #444;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<header>
  <h1>Notes</h1>
  <div class="actions">
    <button id="discard">Discard</button>
    <button class="primary" id="save">Save</button>
  </div>
</header>
<textarea id="editor" placeholder="Start typing…" spellcheck="false"></textarea>
<footer>
  <span id="status">connecting…</span>
  <span id="charcount">0 chars</span>
</footer>

<script>
(function () {
  // The component stores the text exactly as typed. Messages are JSON; each
  // save names the revision it was edited from and is acknowledged by its
  // sequence number, so a reply never replaces text typed after it was sent.
  var editor = document.getElementById('editor');
  var statusEl = document.getElementById('status');
  var charEl = document.getElementById('charcount');
  var saveButton = document.getElementById('save');
  var saved = '';
  var rev = null;
  var seq = 0;
  var pending = null;

  function setStatus(msg) { statusEl.textContent = msg; }
  function countChars() { charEl.textContent = editor.value.length + ' chars'; }
  function send(message) { window.weftIpc.send(JSON.stringify(message)); }

  editor.addEventListener('input', countChars);

  saveButton.addEventListener('click', function () {
    if (!window.weftIpc || rev === null || pending) return;
    seq += 1;
    pending = { seq: seq, text: editor.value };
    send({ op: 'save', seq: seq, base: rev, text: pending.text });
    saveButton.disabled = true;
    setStatus('saving…');
  });

  // Discard reloads the stored notes, replacing unsaved edits.
  document.getElementById('discard').addEventListener('click', function () {
    if (!window.weftIpc || pending) return;
    editor.value = saved;
    countChars();
    rev = null;
    send({ op: 'load' });
    setStatus('reloading…');
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveButton.click();
    }
  });

  function onMessage(raw) {
    var msg;
    try { msg = JSON.parse(raw); } catch (_) { return; }
    if (msg.op === 'loaded') {
      // Edits made while the load was in flight are kept.
      if (editor.value === saved) {
        editor.value = msg.text;
        countChars();
      }
      saved = msg.text;
      rev = msg.rev;
      setStatus('');
    } else if (msg.op === 'saved' && pending && msg.seq === pending.seq) {
      saved = pending.text;
      rev = msg.rev;
      pending = null;
      saveButton.disabled = false;
      setStatus('saved');
      setTimeout(function () { if (!pending) setStatus(''); }, 1500);
    } else if (msg.op === 'error') {
      if (pending && msg.seq === pending.seq) {
        pending = null;
        saveButton.disabled = false;
      }
      setStatus(msg.conflict
        ? 'not saved: changed in another window. Copy your text, then Discard to reload.'
        : 'error: ' + msg.message);
    }
  }

  function setupIpc() {
    if (!window.weftIpc) { setTimeout(setupIpc, 50); return; }
    window.weftIpc.onmessage = onMessage;
    send({ op: 'load' });
  }

  setupIpc();
})();
</script>
</body>
</html>
