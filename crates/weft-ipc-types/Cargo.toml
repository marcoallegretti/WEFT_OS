[package]
name = "weft-ipc-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
