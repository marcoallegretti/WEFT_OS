<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WEFT frame reference</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #red { background: rgb(255, 0, 0); }
  #green { background: rgb(0, 255, 0); }
  #blue { background: rgb(0, 0, 255); }
  #white { background: rgb(255, 255, 255); color: rgb(0, 0, 0); font: 32px sans-serif; }
</style>
</head>
<body>
  <div id="red"></div>
  <div id="green"></div>
  <div id="blue"></div>
  <div id="white">WEFT</div>
</body>
</html>
